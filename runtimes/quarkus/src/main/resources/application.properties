# Quarkus-only configuration. The Jakarta EE servers configure the same things in
# their runtimes/<name>/config (see docs/runtimes.md).
quarkus.application.name=jakarta-portable
quarkus.http.port=8080

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:orders}
quarkus.datasource.password=${DB_PASSWORD:orders}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
quarkus.datasource.jdbc.max-size=50

# The persistence unit comes from the shared persistence.xml (the explicit Hibernate dialect
# lives there, so all five runtimes behave the same way). Schema generation is chosen at build
# time: ${ddl.action} is substituted by Maven, so "none" by default and drop-and-create with
# -Pdev-schema, exactly like the WAR and exactly like persistence.xml.
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.database.generation=${ddl.action}

# MP Health lives under /q/health on Quarkus; /health on the EE servers.
quarkus.smallrye-health.root-path=/q/health

# Jakarta Batch: in-memory repository would lose the execution history across restarts.
quarkus.jberet.repository.type=jdbc
quarkus.jberet.job."invoiceJob".cron=0 0 2 1 * ?

quarkus.http.limits.max-body-size=1M
quarkus.http.enable-compression=true

# Security headers (the EE servers set the same values from SecurityHeadersFilter).
quarkus.http.header."Content-Security-Policy".value=default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."Referrer-Policy".value=no-referrer

quarkus.log.category."com.example.app".level=INFO

# StartupDataSeeder observes @Initialized(ApplicationScoped.class), which Quarkus fires before Hibernate is
# ready; QuarkusStartup seeds on StartupEvent instead.
quarkus.arc.exclude-types=com.example.app.core.StartupDataSeeder
